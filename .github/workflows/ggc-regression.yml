name: GGC Regression Gate
# Verify GGC-001 development branch before any production promotion.
on:
  push:
    branches:
      - test/isolated-supabase-regression
      - ggc-001-live-record-migration
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
