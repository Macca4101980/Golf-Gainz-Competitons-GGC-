name: V4 PostgreSQL Integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261008_v4_*.sql'
      - 'test/v4-postgres-integration.mjs'
      - '.github/workflows/v4-postgres-integration.yml'
  workflow_dispatch:
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ggc_v4_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ggc_v4_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock --ignore-scripts pg
      - run: node test/v4-postgres-integration.mjs
