name: GGC isolated sync tests
on:
  push:
    branches:
      - fix/record-sync-data-integrity-20261011
  workflow_dispatch:
jobs:
  sync-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
