name: GGC isolated regression checks
on:
  push:
    branches:
      - test/isolated-supabase-regression
  pull_request:
    branches:
      - main
  workflow_dispatch:
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
